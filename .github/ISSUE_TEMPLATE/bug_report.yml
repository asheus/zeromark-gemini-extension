name: Bug report
description: Something in the extension or connector does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For a security problem, please follow SECURITY.md instead of filing here.
  - type: dropdown
    id: auth
    attributes:
      label: How you connected
      options:
        - OAuth sign-in (the extension)
        - ZeroMark key in settings.json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked, which tool ran, and what came back. Please leave out the contents of your saves.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gemini CLI version
      placeholder: "gemini --version"
